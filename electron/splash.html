<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Ornament Design Prototype — Splash</title>
<style>
  :root {
    --bg: #08080a;
    --flamingo: #e39690;
    --glow: rgba(227, 150, 144, 0.55);
  }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: var(--bg);
    overflow: hidden;
  }

  .stage {
    position: relative;
    width: 100vw;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* Soft ambient glow that blooms in behind the flamingo as it unfurls */
  .glow {
    position: absolute;
    width: min(60vmin, 420px);
    height: min(60vmin, 420px);
    border-radius: 50%;
    background: radial-gradient(circle, var(--glow) 0%, rgba(227,150,144,0) 70%);
    opacity: 0;
    transform: scale(0.6);
    animation: glowIn 1.6s ease-out 0.75s forwards;
    filter: blur(2px);
    pointer-events: none;
  }

  @keyframes glowIn {
    0%   { opacity: 0;   transform: scale(0.5); }
    45%  { opacity: 0.9; transform: scale(1.05); }
    100% { opacity: 0.35; transform: scale(1); }
  }

  /* ---------- The ball that swoops in ---------- */
  .ball {
    position: absolute;
    width: 26px;
    height: 26px;
    border-radius: 50%;
    background: var(--flamingo);
    box-shadow: 0 0 18px 4px var(--glow);
    opacity: 0;
    animation: ballSwoop 1.05s cubic-bezier(0.22, 0.61, 0.16, 1) 0s forwards;
    will-change: transform, opacity;
  }

  @keyframes ballSwoop {
    0%   { transform: translate(-46vw, -34vh) scale(0.4); opacity: 0; }
    7%   { opacity: 1; }
    52%  { transform: translate(4vw, -3vh) scale(1.25); opacity: 1; }
    72%  { transform: translate(-1.5vw, 1vh) scale(0.85); opacity: 1; }
    88%  { transform: translate(0, 0) scale(0.45); opacity: 1; }
    100% { transform: translate(0, 0) scale(0.05); opacity: 0; }
  }

  /* ---------- The flamingo silhouette ---------- */
  .flamingo-wrap {
    position: relative;
    width: min(56vmin, 400px);
    height: min(56vmin, 400px);
    transform: scale(0.55);
    animation: flamingoPop 0.95s cubic-bezier(0.34, 1.56, 0.64, 1) 0.82s forwards;
  }

  @keyframes flamingoPop {
    0%   { transform: scale(0.5); }
    65%  { transform: scale(1.07); }
    82%  { transform: scale(0.97); }
    100% { transform: scale(1); }
  }

  .flamingo-svg { width: 100%; height: 100%; overflow: visible; }

  .flamingo-path {
    fill: var(--flamingo);
    fill-opacity: 0;
    stroke: var(--flamingo);
    stroke-width: 3;
    stroke-linejoin: round;
    stroke-linecap: round;
    stroke-dasharray: 2260;
    stroke-dashoffset: 2260;
    animation:
      drawPath 1.05s cubic-bezier(0.45, 0, 0.4, 1) 0.85s forwards,
      fillIn 0.8s ease-in 1.35s forwards;
  }

  @keyframes drawPath {
    to { stroke-dashoffset: 0; }
  }
  @keyframes fillIn {
    to { fill-opacity: 1; }
  }

  /* Eye: a background-colored dot sitting on the head; fades in with the fill,
     then blinks (a quick wink) once settled, and periodically thereafter. */
  .eye {
    fill: var(--bg);
    opacity: 0;
    transform-origin: 424px 124px;
    animation:
      eyeIn 0.5s ease-out 1.75s forwards,
      wink 3.6s ease-in-out 2.3s infinite;
  }

  @keyframes eyeIn {
    to { opacity: 1; }
  }

  @keyframes wink {
    0%   { transform: scaleY(1); }
    4%   { transform: scaleY(0.05); }
    9%   { transform: scaleY(1); }
    100% { transform: scaleY(1); }
  }
</style>
</head>
